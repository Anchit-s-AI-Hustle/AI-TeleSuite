name: CI
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck > typecheck-errors.txt 2>&1
      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-errors
          path: typecheck-errors.txt
          if-no-files-found: error
      - name: Enforce typecheck
        if: steps.typecheck.outcome == 'failure'
        run: |
          cat typecheck-errors.txt
          exit 1
      - run: npm run build
        env:
          GOOGLE_API_KEY: ci-placeholder
